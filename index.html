<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        function isExtNoise(msg, detail) {
          var s = String(msg || '') + ' ' + String(detail || '');
          return s.indexOf('MetaMask') !== -1 || s.indexOf('chrome-extension://') !== -1;
        }
        window.addEventListener(
          'unhandledrejection',
          function (e) {
            var r = e && e.reason;
            if (isExtNoise(r && r.message ? r.message : r, r && r.stack)) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          },
          true
        );
        window.addEventListener(
          'error',
          function (e) {
            if (isExtNoise(e && e.message, e && e.filename)) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          },
          true
        );
      })();
    </script>
    <title>Cóndores del Sur 1982 — Arcade Malvinas</title>
    <meta
      name="description"
      content="Juego arcade vertical retro estilo Aero Fighters / 1945 ambientado en la Guerra de Malvinas. Elige entre 4 aeronaves argentinas y enfrenta a la flota británica."
    />
    <meta property="og:title" content="Cóndores del Sur 1982 — Arcade Malvinas" />
    <meta
      property="og:description"
      content="Juego arcade vertical retro ambientado en la Guerra de Malvinas. Hecho por Juan Martin Echegaray."
    />

      rel="stylesheet"
    />
  </head>
